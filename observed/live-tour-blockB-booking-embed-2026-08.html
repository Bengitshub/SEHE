     (function () {
       var ORIGIN = 'https://bookings.pounamutourismgroup.com';
       var wrap = document.currentScript.parentNode;
       var frame = document.createElement('iframe');
       frame.className = 'mlw-embed';
       frame.src = ORIGIN + '/sir-ed?keyword=14+day&from=2026-10-01&to=2027-04-30';
       frame.title = 'Book the 14 Day Explorer 2026/27';
       frame.setAttribute('scrolling', 'no');
       frame.setAttribute('allow', 'payment; clipboard-write');
       frame.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
       wrap.appendChild(frame);
       window.addEventListener('message', function (e) {
         if (e.origin !== ORIGIN) return;
         if (!e.data || typeof e.data !== 'object') return;
         if (e.data.type === 'mlw-resize' && typeof e.data.height === 'number') {
           var h = Math.max(200, Math.round(e.data.height));
           if (h > 12000) return;
           frame.style.height = h + 'px';
           return;
         }
         if (e.data.type === 'mlw-scroll-top' || e.data.type === 'mlw-open') {
           if (frame && frame.scrollIntoView) {
             frame.scrollIntoView({ behavior: 'smooth', block: 'start' });
           }
         }
       });
     })();
                

                      </script>
